name: debug k3s net
on:
  pull_request:
    branches: [main]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/install-k3s-ubuntu.sh
      - name: deploy with published images
        env:
          PULL_REGISTRY: ghcr.io/zyvorai
          IMAGE_TAG: latest
          HELM_VALUES_FILE: values-ci.yaml
        run: bash deploy/scripts/deploy-remote-k3s.sh || true
      - name: diagnose
        if: always()
        run: |
          export KUBECONFIG="${HOME}/.kube/config"
          sleep 60
          echo "::group::pods"; kubectl -n zyvor get pods -o wide; echo "::endgroup::"
          echo "::group::postgres ps/ls"; kubectl -n zyvor exec deploy/postgresql -- sh -c 'ps; pg_isready -U zyvor -h 127.0.0.1; ls -la /var/lib/postgresql/data | head; cat /proc/1/cmdline | tr "\0" " "' || true; echo "::endgroup::"
          echo "::group::postgres logs"; kubectl -n zyvor logs deploy/postgresql --tail=50 || true; kubectl -n zyvor logs deploy/postgresql --previous --tail=20 || true; echo "::endgroup::"
          echo "::group::api logs"; kubectl -n zyvor logs deploy/zyvor-api -c zyvor-api --tail=30 || true; echo "::endgroup::"
          echo "::group::svc/endpoints"; kubectl -n zyvor get svc,endpoints -o wide; echo "::endgroup::"
          echo "::group::net probe"
          PGIP=$(kubectl -n zyvor get pod -l app=postgresql -o jsonpath='{.items[0].status.podIP}')
          timeout 120 kubectl -n zyvor run probe --rm -i --restart=Never --image=docker.io/library/busybox:1.36 --command -- sh -c "echo pod-ip $PGIP; nc -zv -w 5 $PGIP 5432; echo rc=\$?; nc -zv -w 5 postgresql 5432; echo rc=\$?; nc -zv -w 5 redis 6379; echo rc=\$?" || true
          echo "::endgroup::"
          echo "::group::host net"; ip -br a; sysctl net.bridge.bridge-nf-call-iptables net.ipv4.ip_forward 2>&1; lsmod | grep -E 'br_netfilter|nf_tables|ip_tables|overlay' ; iptables -V; sudo iptables-save | grep -c . ; sudo iptables -S FORWARD | head; sudo nft list ruleset 2>/dev/null | head -40; systemctl is-active ufw; echo "::endgroup::"
          echo "::group::dmesg"; sudo dmesg | tail -30; echo "::endgroup::"
