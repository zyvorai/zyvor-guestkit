name: debug k3s net
on:
  pull_request:
    branches: [main]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/install-k3s-ubuntu.sh
      - name: deploy with published worker/api images, local UI image
        env:
          PULL_REGISTRY: ghcr.io/zyvorai
          IMAGE_TAG: latest
          HELM_VALUES_FILE: values-ci.yaml
        run: |
          export KUBECONFIG="${HOME}/.kube/config"
          bash deploy/scripts/deploy-remote-k3s.sh || true
          sudo podman build --format docker -t zyvor-ui:latest -f deploy/ui/Dockerfile deploy/ui
          sudo podman save zyvor-ui:latest -o /tmp/ui.tar
          sudo k3s ctr -n k8s.io images import /tmp/ui.tar
          sudo k3s ctr -n k8s.io images tag localhost/zyvor-ui:latest docker.io/library/zyvor-ui:latest || true
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          helm upgrade zyvor deploy/helm/zyvor -n zyvor --reuse-values --set zyvorUi.image=zyvor-ui:latest
          kubectl -n zyvor rollout restart deployment/zyvor-ui
          kubectl -n zyvor rollout status deployment/zyvor-ui --timeout=120s
          kubectl -n zyvor rollout status deployment/zyvor-api --timeout=180s
          kubectl -n zyvor rollout status deployment/postgresql --timeout=60s
      - name: e2e orchestrator
        timeout-minutes: 15
        run: bash deploy/scripts/ci-k3s-e2e.sh
      - name: dump
        if: always()
        run: |
          export KUBECONFIG="${HOME}/.kube/config"
          kubectl -n zyvor get pods -o wide
          kubectl -n zyvor logs deploy/zyvor-api -c zyvor-api --tail=60 || true
          kubectl -n zyvor logs deploy/guestkit-worker --tail=60 || true
