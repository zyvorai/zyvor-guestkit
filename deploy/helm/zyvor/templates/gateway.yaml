{{- if .Values.gateway.enabled }}
# Gateway API front door served by Setura (https://github.com/zyvorai/zyvor-setura-gateway).
# Install the controller once per cluster:
#   setura gateway install --image ghcr.io/zyvorai/zyvor-setura-gateway:0.7.0 --namespace setura-system | kubectl apply -f -
# The Ingress templates stay available; enable this instead of `ingress.enabled`, not as well.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zyvor-gateway
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.httpPort }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if and .Values.gateway.tls .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zyvor-ui
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: zyvor-gateway
  hostnames:
    - {{ .Values.ingress.hosts.ui | quote }}
  rules:
    - backendRefs:
        - name: zyvor-ui
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zyvor-api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: zyvor-gateway
  hostnames:
    - {{ .Values.ingress.hosts.api | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: zyvor-api
          port: 8080
{{- if .Values.gateway.uiBackendTLS.enabled }}
---
# The UI image serves HTTPS on 8443 with its own certificate; verify it against this CA ConfigMap
# (key ca.crt) with the name the certificate carries.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: zyvor-ui-backend-tls
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: zyvor-ui
  validation:
    hostname: {{ .Values.gateway.uiBackendTLS.hostname | quote }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.gateway.uiBackendTLS.caConfigMap }}
{{- end }}
{{- end }}
