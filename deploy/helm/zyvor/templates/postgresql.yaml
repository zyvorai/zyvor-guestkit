{{- if .Values.persistence.postgresql.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: {{ .Values.namespace }}
  labels:
    app: postgresql
spec:
  accessModes:
    - {{ .Values.persistence.postgresql.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.postgresql.size }}
  {{- if .Values.persistence.postgresql.storageClass }}
  storageClassName: {{ .Values.persistence.postgresql.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      {{- with .Values.postgresql.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zyvor-secrets
                  key: postgresql-password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            {{- if .Values.persistence.postgresql.enabled }}
            # Avoid "lost+found" / root ownership issues on raw PVCs
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
          ports:
            - containerPort: 5432
          # Ready only once Postgres accepts connections, so rollouts (and the API's
          # first connection) do not race the database's initdb.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              memory: {{ .Values.postgresql.memoryRequest | default "128Mi" | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.persistence.postgresql.enabled }}
          persistentVolumeClaim:
            claimName: postgresql-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
